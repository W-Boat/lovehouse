<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211a22"><meta name="description" content="推开门，走进一间只为你准备的像素生日小屋。"><title>给你的生日小屋</title><link rel="icon" href="./assets/favicon.webp"><style>html,body{margin:0;background:#282b30}#boot-cover{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 40%,#46524b,#262c32 75%);color:#f4dfba;font-family:CottagePixel,monospace}#boot-cover .boot-card{box-sizing:border-box;width:min(440px,90vw);padding:24px 30px 28px;text-align:center;border:4px solid #b98a68;outline:4px solid #302d31;box-shadow:inset 0 0 0 3px #6c5148,0 12px 0 #1c2227;background:#303a38}#boot-cover .boot-art{display:block;width:180px;height:180px;object-fit:contain;image-rendering:pixelated;margin:0 auto 4px}#boot-cover h1{font-size:24px;line-height:1.5;margin:0 0 8px;font-weight:400;letter-spacing:4px}#boot-cover .boot-caption{font-size:12px;color:#c1c7ad;line-height:2;margin:0 0 20px}#boot-text{display:block;font-size:12px;min-height:24px;line-height:2}#boot-progress{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;padding:5px;margin:10px 0;border:3px solid #b59472;background:#1d2829}#boot-progress b{display:block;height:12px;background:#42504b}#boot-progress b.lit{background:#e2b77d;box-shadow:inset 0 3px #f5d7a3,inset 0 -3px #b98761}#boot-percent{font:12px CottagePixel,monospace;color:#d7c3a4}#boot-retry{display:block;min-height:44px;margin:18px auto 0;padding:10px 18px;border:3px solid #b98a68;border-radius:0;background:#efd4a5;color:#392e31;box-shadow:inset 2px 2px #fff0cf,3px 3px #1c2227;font:16px CottagePixel,monospace;cursor:pointer}#boot-retry[hidden]{display:none}#boot-retry:focus-visible{outline:3px solid #f6dfa0;outline-offset:5px}body[data-boot-state=error] #boot-text{color:#ffcfb0}body[data-boot-state=error] #boot-percent{color:#e7bfa0}@media(max-height:480px){#boot-cover .boot-card{padding:12px 24px;width:420px}#boot-cover .boot-art{width:110px;height:110px}#boot-cover .boot-caption{margin-bottom:8px}}</style><link rel="stylesheet" href="./assets/fonts.css"></head><body data-boot-state="loading">
<div id="boot-cover" role="status" aria-live="polite"><div class="boot-card"><img class="boot-art" src="./assets/loading-cottage.webp" alt="亮着灯的像素小屋"><h1>给你的生日小屋</h1><p class="boot-caption">礼物、烛光，还有等你回来的那个人</p><span id="boot-text">正在为你点灯…</span><div id="boot-progress" role="progressbar" aria-label="小屋加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><span id="boot-percent">0 / 100</span><button id="boot-retry" type="button" hidden>重新点亮小屋</button><noscript>请开启 JavaScript 后重试。</noscript></div></div><div id="app">
<main id="game-frame" class="game-frame"><div id="game" aria-label="生日小屋游戏场景"></div>
<div class="opening" id="opening"><div class="opening-card"><span class="eyebrow">A LITTLE PLACE, JUST FOR YOU</span><span class="title-ornament">✧ ── ✿ ── ✧</span><h1>给你的<br><strong>生日小屋</strong></h1><p>礼物、烛光，和等你回来的那个人。<br>今晚的时间，都留给你。</p><div id="load-status" class="load-status" role="status">正在点亮小屋…</div><div class="load-track"><i id="load-bar"></i></div><button class="secondary hidden" id="retry-load">重新点亮小屋</button><small id="entry-note">灯火准备好，就为你开门</small></div></div>
<div class="game-hud" id="game-hud"><nav id="world-signs" aria-label="场景出口"></nav><div class="place-plaque"><span>☾</span><div><b id="location-name">温暖的小屋</b><small id="location-caption">特别的一天 · 月色晴朗</small></div></div>
<nav class="hud-tools" aria-label="游戏工具"><button class="icon-button" id="music" aria-label="开启音乐" title="音乐"></button><button class="icon-button" id="journal" aria-label="打开礼物手记" title="礼物手记"></button><button class="icon-button" id="photo" aria-label="生日合影" title="合影"></button><button class="icon-button" id="fullscreen" aria-label="全屏横屏" title="全屏横屏"></button><button class="icon-button" id="bag" aria-label="背包" title="背包">背包</button><button class="icon-button" id="tools-toggle" aria-expanded="false" aria-label="收起或展开工具">工具</button><button class="icon-button" id="settings" aria-label="设置" title="设置"></button></nav>
<div class="explore-tools"><button id="map-toggle" aria-expanded="false">地图</button><button id="companion-toggle">陪伴</button><button id="sky-settings">天气 / 时间</button></div><aside id="mini-map" class="mini-map hidden" aria-label="探索地图"></aside><div class="hud-progress" id="progress"><span aria-hidden="true"></span> <b>0</b><small>/ 12 份心意</small></div><div class="location-toast" id="location-toast"></div><button class="interact-hint hidden" id="nearby" aria-label="与附近物件互动"></button><div id="destination-mark" aria-hidden="true"></div><div class="path-notice hidden" id="path-notice"><span id="path-label"></span><button id="cancel-walk" aria-label="停下脚步">×</button></div><p class="resting-line hidden" id="resting-line" role="status"></p>
<div class="touch-controls" id="touch-controls"><div id="joystick" role="application" aria-label="移动摇杆"><div id="joystick-knob"></div></div><button id="interact" aria-label="与附近物件互动">✦<small>互动</small></button></div><button id="stand" class="primary hidden">起身，继续走走</button><span id="save-status" class="autosave">自动珍藏</span><span class="keyboard-tip">WASD 移动 · E 互动 · 点击物件走近</span></div></main>
<section id="ceremony" class="ceremony hidden" role="dialog" aria-modal="true" aria-labelledby="ceremony-title"><canvas id="ceremony-canvas" aria-hidden="true"></canvas><div class="ceremony-heading"><h2 id="ceremony-title"></h2><p id="ceremony-caption"></p></div><button id="ceremony-music" aria-label="开关音乐"></button><button id="ceremony-close" aria-label="关闭或跳过动画">×</button><button id="ceremony-action" class="primary"></button></section><section id="dialogue" class="dialogue hidden" role="dialog" aria-labelledby="dialogue-speaker"><div id="dialogue-portrait" class="dialogue-portrait"></div><div class="dialogue-content"><h2 id="dialogue-speaker"></h2><p id="dialogue-text"></p><div id="dialogue-choices"></div></div><button id="dialogue-close" aria-label="结束对话">×</button></section><div class="modal-backdrop hidden" id="modal-backdrop"><section class="modal parchment" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" id="close-modal" aria-label="关闭">×</button><div id="modal-content"></div></section></div><div class="toast hidden" id="toast" role="status"></div>
</div><script type="module" src="/src/bootstrap.ts"></script></body></html>
