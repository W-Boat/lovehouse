name: Lovehouse thin shell
on:
  workflow_dispatch:
    inputs:
      base:
        description: Existing full package revision
        required: true
        default: 9b1d5d95b526
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: pip install pillow
      - run: python -X utf8 tools/prepare_android_icons.py
      - name: Build and verify compatible signed shell
        env:
          LOVEHOUSE_THIN_BASE: ${{ inputs.base }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lovehouse-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ "$LOVEHOUSE_THIN_BASE" =~ ^[a-f0-9]{12}$ ]]
          export LOVEHOUSE_NATIVE_REVISION="thin-${GITHUB_SHA::12}"
          export GITHUB_RUN_NUMBER=$((10000+GITHUB_RUN_NUMBER))
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          python -c "import os,base64,pathlib; pathlib.Path(os.environ['ANDROID_KEYSTORE_PATH']).write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True))"
          gradle --project-dir android :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk lovehouse-shell.apk
          python tools/check_android_signature.py lovehouse-shell.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging lovehouse-shell.apk | sed -n '1p'
          unzip -l lovehouse-shell.apk | grep 'assets/index.html'
          test "$(stat -c%s lovehouse-shell.apk)" -lt 10485760
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-android-shell
          path: lovehouse-shell.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build portable shell
        shell: pwsh
        env:
          LOVEHOUSE_THIN_BASE: ${{ inputs.base }}
        run: |
          if ($env:LOVEHOUSE_THIN_BASE -cnotmatch '^[a-f0-9]{12}$') { throw 'Invalid base revision' }
          $env:LOVEHOUSE_NATIVE_REVISION = 'thin-' + $env:GITHUB_SHA.Substring(0,12)
          $config = '{"build":{"beforeBuildCommand":"","frontendDist":"../shell-bootstrap"}}'
          [IO.File]::WriteAllText((Join-Path $PWD 'src-tauri/thin-build.json'), $config)
          npx tauri build --no-bundle --config src-tauri/thin-build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item src-tauri/target/release/lovehouse.exe
          if ($exe.Length -ge 40MB) { throw 'Shell contains unexpected bundled assets' }
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath lovehouse-shell.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-windows-shell
          path: lovehouse-shell.zip
          if-no-files-found: error
