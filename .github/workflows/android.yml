name: Lovehouse Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lovehouse-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pip install pillow fonttools brotli
      - run: npm ci
      - run: npm run build
      - name: Prepare Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          python -c "from PIL import Image; Image.open('dist/assets/favicon.webp').save('android/app/src/main/res/drawable-nodpi/cottage_icon.png')"
      - run: gradle --project-dir android :app:assembleDebug
      - name: Verify installable package and offline assets
        run: |
          mkdir -p android-delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk android-delivery/生日小屋-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android-delivery/生日小屋-Android.apk
          python -X utf8 tools/check_android_apk.py android-delivery/生日小屋-Android.apk
          cp docs/Android离线版.md android-delivery/
          git rev-parse HEAD > android-delivery/commit.txt
          cd android-delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-android-offline
          path: android-delivery
          if-no-files-found: error
