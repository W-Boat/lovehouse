name: Lovehouse Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      defer_acceptance:
        description: Build only; postpone acceptance checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lovehouse-android-${{ github.ref }}
  cancel-in-progress: true
env:
  LOVEHOUSE_CONTENT_SERVER: ${{ vars.LOVEHOUSE_CONTENT_SERVER }}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android platform and build tools
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: pip install pillow fonttools brotli cryptography
      - if: ${{ !inputs.defer_acceptance }}
        run: python -m unittest discover -s tools -p test_hot_update.py
      - run: npm ci
      - run: npm run build
      - name: Prepare Android launcher icon
        run: python -X utf8 tools/prepare_android_icons.py
      - name: Restore fixed Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python -c "import os,base64,pathlib; value=os.environ['ANDROID_KEYSTORE_BASE64']; assert value, 'Android signing secret is missing'; pathlib.Path(os.environ['RUNNER_TEMP'],'lovehouse-signing.p12').write_bytes(base64.b64decode(value,validate=True))"
      - run: gradle --project-dir android :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lovehouse-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Verify installable package and offline assets
        run: |
          mkdir -p android-delivery
          cp android/app/build/outputs/apk/release/app-release.apk android-delivery/生日小屋-Android.apk
          python -X utf8 tools/check_android_signature.py android-delivery/生日小屋-Android.apk
          python -X utf8 tools/check_android_apk.py android-delivery/生日小屋-Android.apk
          cp docs/Android离线版.md android-delivery/
          cp docs/android-signing-cert.sha256 android-delivery/
          git rev-parse HEAD > android-delivery/commit.txt
          cd android-delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-android-offline
          path: android-delivery
          if-no-files-found: error
      - name: Build signed resource update
        run: python -X utf8 tools/package_hot_update.py --version "$GITHUB_RUN_NUMBER"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lovehouse-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-content-update
          path: hot-update-delivery
          if-no-files-found: error
