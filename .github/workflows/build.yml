name: Lovehouse builds
concurrency:
  group: lovehouse-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build the Windows portable client without running web acceptance
        type: boolean
        default: false
permissions:
  contents: read
env:
  LOVEHOUSE_CONTENT_SERVER: ${{ vars.LOVEHOUSE_CONTENT_SERVER }}
jobs:
  web:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow fonttools brotli
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx vite build --mode e2e
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lovehouse-web-and-checks
          path: |
            dist
            playwright-report
            test-results
            docs
            文案.md
            需替换内容.md
  publisher:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --prefix admin
      - run: npm run build --prefix admin
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-publisher
          path: |
            admin/dist
            tools/cloud-*.mjs
            content/cloud-*.mjs
            docs/云端内容配置.md
            docs/发布后台操作手册.md
            docs/发布Agent操作手册.md
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: pip install pillow fonttools brotli
      - run: npm ci
      - run: npm run desktop:build
      - name: Record portable build provenance
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content -Encoding ascii docs/windows-commit.txt
          $exe = Get-Item -LiteralPath src-tauri/target/release/lovehouse.exe
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lovehouse.exe" | Set-Content -Encoding ascii docs/windows-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lovehouse-windows-x64-portable
          path: |
            src-tauri/target/release/lovehouse.exe
            src-tauri/Cargo.lock
            docs/Windows便携版.md
            docs/windows-commit.txt
            docs/windows-sha256.txt
            文案.md
            需替换内容.md
