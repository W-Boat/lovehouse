name: Interaction visual checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tea-and-scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow fonttools brotli
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx vite build --mode e2e
      - run: npx playwright test e2e/tea.spec.ts e2e/display-scale.spec.ts e2e/interaction-props.spec.ts e2e/content-updates.spec.ts e2e/interaction-targets.spec.ts e2e/taoyuan.spec.ts --max-failures=0
        env:
          CI: 'true'
      - run: npx playwright test e2e/minigames.spec.ts --grep "claw catches" --max-failures=0 --output=claw-test-results
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: claw-playwright-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tea-and-scaling-checks
          path: |
            playwright-report
            test-results
            claw-test-results
            claw-playwright-report
