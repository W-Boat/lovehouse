<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日小屋</title>
<link rel="stylesheet" href="./cottage.css">
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#191923;color:#fff0d9}
*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:1.5rem;background:radial-gradient(ellipse at 50% 0,#3b2c49 0,transparent 65%),#191923}
main{width:min(100%,32rem);padding:clamp(1rem,4vw,2rem);border:4px solid #f4c490;box-shadow:0 0 0 4px #2a1d2d,8px 8px 0 #100e16;background:#282232}
header{display:flex;align-items:center;gap:1rem}.station{width:54px;height:54px;flex:none;image-rendering:pixelated}small{color:#ffc77e;letter-spacing:.18em}h1{font-size:clamp(1.25rem,5vw,1.8rem);margin:.2rem 0 0}.label{display:flex;justify-content:space-between;gap:1rem;margin:1.25rem 0 .5rem;font-size:.9rem}output{font:700 1rem ui-monospace,monospace;color:#ffd38e;white-space:nowrap}.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;padding:4px;height:23px;background:#191724;border:2px solid #8f7191}.meter i{background:#40364a}.meter i.on{background:#efae80;box-shadow:inset 0 3px #ffe3a9}.meter[data-wait=true] i:nth-child(3n+1){animation:pulse 1.3s steps(2,end) infinite}.meter[data-wait=true] i:nth-child(3n+2){animation:pulse 1.3s .3s steps(2,end) infinite}@keyframes pulse{50%{background:#78586e}}@media(prefers-reduced-motion:reduce){.meter i{animation:none!important}}
p{color:#d8c4da;line-height:1.55;font-size:.85rem;margin:.7rem 0 0}.buttons{display:flex;gap:.7rem;margin-top:1rem;flex-wrap:wrap}.buttons:empty{display:none}button{min-height:44px;padding:.5rem .85rem;border:2px solid #efae80;border-radius:0;background:#452f49;color:#fff0d9;box-shadow:3px 3px #18141f;font:inherit}button:focus-visible{outline:2px dashed #fff;outline-offset:4px}
main{width:min(100%,550px);padding:0;background:#32242a;border-color:#d6ae64}.intro{padding:clamp(12px,3vw,24px)}button{background:#75492f;border-color:#e3b16c}@media(max-height:520px){.art{max-height:27vh}}
</style>
<main>
<img class="art" src="./cottage.webp" alt="亮着灯的像素小屋">
<div class="intro">
<header><svg class="station" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#443453" d="M0 0h16v16H0z"/><path fill="#efae80" d="M7 2h2v1h2v1h2v1h2v2H1V5h2V4h2V3h2z"/><path fill="#a36373" d="M3 7h10v6H3z"/><path fill="#ffd38e" d="M4 8h2v2H4zm6 0h2v2h-2z"/><path fill="#332234" d="M7 9h2v4H7z"/><path fill="#a8b483" d="M1 13h14v1H1z"/></svg><div><h1>给你的生日小屋</h1></div></header>
<div class="label"><span id="status" role="status">正在准备资源…</span><output id="percent">—</output></div>
<div class="meter" id="bar" role="progressbar" aria-label="资源下载进度" aria-valuemin="0" aria-valuemax="100" data-wait="true"></div>
<p id="size" hidden></p><p>首次启动需要联网布置。下载完成后，已准备好的小屋可离线打开。</p>
<div class="buttons"><button id="retry" type="button" hidden>重新连接</button><button id="install" type="button" hidden>下载资源</button></div>
</div>
</main>
<script>
const byId = id => document.getElementById(id);
const bar = byId('bar');
for(let i=0;i<20;i++)bar.append(document.createElement('i'));
const send = action => (window.CottageSave||window.CottageDesktop)?.postMessage(JSON.stringify({kind:'content-update',action,retry:true,url:'https://server.080726.xyz/lovehouse/android-update/update.json'}));
byId('retry').onclick = () => send('auto');
byId('install').onclick = () => send('install');
let seenProgress = false;
const mib = bytes => (bytes/1048576).toFixed(1);
document.addEventListener('cottage-update-status', ({detail:s}) => {
 if (seenProgress && ['idle','current','busy'].includes(s.phase)) return;
 if (['checking','downloading'].includes(s.phase)) seenProgress = true;
 const known = ['downloading','installed'].includes(s.phase)||s.phase==='available'&&s.progress===100;
 const percent = Math.min(100,Math.max(0,Number(s.progress)||0));
 byId('status').textContent = s.phase==='available'&&known&&window.CottageDesktop?'校验完成，请关闭后重新打开小屋。':s.message;
 byId('percent').value = known ? percent+'%' : '—';
 bar.dataset.wait = String(!known && s.phase!=='error');
 if(known)bar.setAttribute('aria-valuenow',percent);else bar.removeAttribute('aria-valuenow');
 [...bar.children].forEach((tile,i)=>tile.classList.toggle('on',known&&i<Math.floor(percent/5)));
 if(s.totalBytes>0){byId('size').textContent=`${mib(s.downloadedBytes)} / ${mib(s.totalBytes)} MiB`;byId('size').hidden=false}
 else if(['checking','error'].includes(s.phase))byId('size').hidden=true;
 byId('retry').hidden=s.phase!=='error';
 byId('install').hidden=s.phase!=='available'||known;
});
send('status');
</script>
</html>
