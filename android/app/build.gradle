plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.wboat.lovehouse'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wboat.lovehouse'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0'
    }
    sourceSets.main.assets.srcDirs = [rootProject.file('../dist')]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
